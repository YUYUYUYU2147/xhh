<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="zzz_role_nk.css" />
</head>
<body >
<div class="page" id="container">
  <!-- 测试服数据标记：右上角 TEST 角标。正式服数据不显示（unreleased 由数据层判定） -->
  
  <!-- 整卡背景：角色立绘。bg 由 fetchZzzRoleCard 填（米游社 tachie_pc，
       取不到就退回 Bwiki 立绘），没有就不渲染这层。 -->
  <img class="bg" src="preview_bg.png" alt="" />
  
  <div class="topbar"></div>

  

  <!-- 顶部：方形透明人物卡面 + 名字 + 稀有度 + 属性/特性/阵营 + 徽章 + 一句话简介
       结构与星铁卡（sr_role_nk）一致，便于两个游戏对照查看 -->
  <header class="hero">
    <img class="avatar" src="" alt="" />
    <div class="hero-txt">
      <h1>艾伦 <span class="rarity">S</span></h1>
      <div class="tags">
        <span class="tag">强攻</span>
        <span class="tag">输出</span>
        <span class="tag">狡兔屋</span>
      </div>
      
      <div class="brief">（预览占位文案，仅用于确认背景图在图鉴上的可见度。）</div>
    </div>
  </header>

  

  <!-- 角色印象与角色详情内容重叠且体量大（洛克茜 859 字），
       合并进「角色详情」展示，卡面不再单列一栏。 -->


  <!-- 基础属性：Bwiki「属性数据」。米游社那边是 JS 滑块、接口不返回数值，
       所以这张表只能取 Bwiki。成长表已在 bwiki_zzz.js 里裁到**最高等级一行**，下半是固定值。 -->
  

  <!-- 技能：按类型合并为 6 组（普攻 / 闪避 / 支援技 / 特殊技 / 终结技 / 核心技），
       组内分支纵向排列；整块左右分栏，与菲林斯卡一致。
       官方把一个技能拆成多条（闪避含闪避/冲刺/冲刺攻击/闪避反击，
       支援技含快速/招架/支援突击，特殊技含特殊技与强化特殊技，
       终结技含连携技与终结技），直接平铺会有 16~17 块、卡面高度翻倍。 -->
  

  <!-- 影画：绝区零对应原神/星铁「天赋 / 命座」位置 -->
  

  <!-- 养成材料：绝区零的「养成消耗总计」，对应原神/星铁的材料总览 -->
  

  <!-- 角色故事不进卡面：与原神/星铁卡一致（菲林斯的故事正文 8 条近 9000 字，
       占了整卡约四成高度、导致图片超限），改为独立指令 #绝区零角色名故事。 -->


  <!-- 攻略（Bwiki 角色页）：配装推荐 / 词条推荐 / 音擎推荐
       页面顶部有免责说明，这里一并带出，避免把编辑者观点当成客观结论 -->
  

  <!-- 卡池信息：数据源与角色详情分开取 ——
       详情/技能/影画/材料来自米游社百科，卡池来自 Bwiki「往期调频」。
       该页只给角色名与稀有度，没有 UP 次数统计，故此处不显示次数。
       S 级与 A 级同列（同时 UP），复刻多期全部列出。 -->
  

  <div class="foot">from 小花火</div>
</div>
</body>
</html>
