# 崩坏3 敌人图鉴（Boss）别名表
# 格式与 bh3_js_names.yaml 一致：标准名: ["标准名", "昵称1", "昵称2", ...]
# 用途：#崩三当前深渊 / 深渊开启群提醒 的图鉴联动，把深渊/社区昵称解析成图鉴标准名。
# 维护：只填「已核实」的映射，填错会把别的 Boss 的图鉴卡张冠李戴，误导群友。
# 待补：量子泥鳅 / 星尘龙虾 在图鉴里暂无对应标准名（标题与搜索接口都查不到），确认后再加。
# 三个「猪」系 Boss 别混：冰猪=帕凡提（冰属性）、虚数猪=摩录多（虚数属性）、迦尼萨只叫「猪」（无属性，主线/乐土）。
帕凡提: ["帕凡提", "冰猪"]
摩录多: ["摩录多", "虚数猪"]
虚树神骸-虚无主义: ["虚树神骸-虚无主义", "神骸-虚无主义", "神骸", "虚树神骸"]
