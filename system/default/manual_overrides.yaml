# ============================================================
# 人工补充项 —— 数据源给不出、只能人工确认的部分
#
# 和 syw.yaml / yiqi.yaml / bh3_syw_names.yaml 那些别名表放在一起，
# 要改哪张表一眼能看到。日常不需要维护，只有两种情况要动：
#   1. 官方新增了四星圣遗物套装 / 星芒常驻光锥，且不落在已自动判定的范围内
#   2. 「待核对」区里某条确认了，把问号改成答案
#
# 本文件只做加法：下面不填就纯走代码里的自动规则，
# 读不到或格式坏了也只是退回自动规则，不会报错、不影响使用。
#
# 语法注意：英文冒号后面要有一个空格。
# ============================================================

# ------------------------------------------------------------
# 原神圣遗物星级
#
# 已自动判定，不用填（65 套 = 五星 47 + 四星 15 + 三星 3）：
#   10001~10009  四星  行者之心/勇士之心/守护之心/奇迹/战狂/武人/教官/赌徒/流放者
#   10010~10011  三星  冒险家 / 幸运儿
#   10012        四星  学士
#   10013        三星  游医
#   15009~15013  四星  祭火/祭水/祭雷/祭风/祭冰之人
#   其余 47 套    五星
#
# 判据是米游社官方 Wiki（ys_obc 频道 218）每套的星级标签，取最高那一档：
# 标签是「这套能掉落的星级档位」，所以 冰风迷途的勇士=五星+四星 → 五星，
# 行者之心=四星+三星 → 四星，冒险家=三星+二星+一星 → 三星。
# 按这个口径判出的 63 套与 nanoka 站点星标逐条比对零冲突。
#
# 以后若新增四星/三星套装，往下面加一条 [最小id, 最大id]；
# 新出的套装历来都是五星，通常不用动。
artifact_4star_ranges_extra: []
# 例：[[15049, 15050]]

# ------------------------------------------------------------
# 星铁常驻 5★ 光锥
#
# 已自动判定，不用填：id >= 24000 的整段，共 7 张（黑塔商店黑塔债券兑换）
#   记一位星神的陨落 / 星海巡航 / 记忆的质料 / 孤独的疗愈
#   不息的演算 / 记忆永不落幕 / 欢愉满溢祝福
# 实测 24xxx 段 7 条全是商店光锥、无一条活动光锥，以后来新的一批自动跟上。
#
# 已按名字列出、不用填：星芒兑换的常驻池 7 张
#   无可取代的东西 / 如泥酣眠 / 银河铁道之夜 / 但战斗还未结束
#   制胜的瞬间 / 以世界之名 / 时节不居
# 这 7 张的 id 混在活动光锥里（23001 于夜色中就夹在 23000 与 23002 之间），
# 且 desc 五星全为 null、atk 区间与活动光锥重叠、详情文件无任何常驻标记，
# 数据里确实分不出来。已与公开资料逐个核对过。
#
# 以后星芒池新增常驻光锥，往下面加名字。
sr_standard_lc_extra: []
# 例：['某个新光锥名']

# ------------------------------------------------------------
# 武器类型覆盖
#
# 绝区零音擎、崩坏3武器、原神武器里有几把在数据源里类型是占位值
# ITEM_TPS_WEAPON，图鉴里显示成「特殊武器」。有依据的在这里写死。
#
# 已确认：索斯卢科的灼炎 = 瓦列里专武，瓦列里 character.json 的
# weapon 字段是 WEAPON_SWORD_ONE_HAND = 单手剑。
weapon_type_override:
  索斯卢科的灼炎: 单手剑

# ------------------------------------------------------------
# 待核对
#
# 以下是数据源确实给不出、也没有旁证能推的项。确认了就把问号替换成答案，
# 移到上面的对应区；确认不了就一直留在这里，不影响使用。
# ------------------------------------------------------------
pending:

  # 原神武器的真实类型。weapon.json 里共 10 把 type 是 ITEM_TPS_WEAPON 占位值，
  # 图鉴里显示成「特殊武器」，其中 224101 索斯卢科的灼炎已在上方覆盖，
  # 剩下这 9 把没有可靠依据。查米游社 Wiki 武器页或游戏内武器背包即可。
  gs_weapon_type_unknown:
    - {id: '224001', zh: '莎塔娜娅的苍银', type: '?'}
    - {id: '224002', zh: '阿夏梅兹的千光', type: '?'}
    - {id: '224003', zh: '瓦尔萨格的日轮', type: '?'}
    - {id: '224004', zh: '榴晶·火', type: '?'}
    - {id: '224005', zh: '榴晶·水', type: '?'}
    - {id: '224006', zh: '榴晶·雷', type: '?'}
    - {id: '224007', zh: '榴晶·冰', type: '?'}
    - {id: '224008', zh: '影域特化榴晶', type: '?'}
    - {id: '224102', zh: '艾维萨缇的山狩', type: '?'}
  # 类型可填值：单手剑 / 双手剑 / 长柄 / 法器 / 弓
  # 填好一条就从这里删掉，并加到上面 weapon_type_override 里

  # nanoka 站点缺图标的圣遗物套装，列表里会走占位图。
  # 站点补传后自动恢复，不需要改这里。
  # 穷举过 3 个版本 × 5 种后缀 × 3 种命名 × 2 种扩展名，全 404；
  # 而 15048 的 _3/_4/_5 后缀全 200，说明拼接方式本身没错，是文件没上传。
  missing_icon:
    - {id: '15004', zh: '冰之川与雪之砂'}
    - {id: '15012', zh: '祭风之人'}

  # 芙宁娜的「气氛值上限：300.0」「元素能量：60.0」带尾零，
  # 要看模板实际用的是什么格式码再决定要不要截断。
  # 定位：system/role_detail.js 的 fillGsDesc
  float_tail_zero:
    - {角色: '芙宁娜', 字段: ['气氛值上限', '元素能量'], 现状: '300.0 / 60.0'}

# ============================================================
# 以下区域不需要人工维护，仅供了解，删掉也不影响运行
# ============================================================
# ★ 卡池数据（gslogs.yaml / sr_logs.yaml / zzz_gacha_pool_history.yaml）
#   是上线顺序的权威来源，有错会有人更正，代码不用替它兜底或猜。
#
# ★ 不要拿 nanoka 网站的显示顺序当依据，那是作者的排序，有错：
#     hsr.nanoka.cc/character/ 把 真珠 排在 星神★阿哈 之前 —— 真珠已上线
#     （正式服 4.6 就在），阿哈未上线，已上线的压过未上线的是错的。
#     hsr.nanoka.cc/lightcone/ 的顺序同样不保证。
#   拿不准时以卡池数据为准，不要反过来去改代码迁就网站。
#   hsr.nanoka.cc/（不带版本号）取到的是测试服数据，
#   static.nanoka.cc/hsr/<版本>/ 才是对应版本的数据。
#
# 角色排序：全部取数据源字段，零名单
#   原神 character.json 152/152 都有 release 字段
#   星铁 character.json 99 个里只有 真珠、星神★阿哈 没字段，
#     这两个由 manifest.json 的 new.character 兜底置顶
#   未上线（测试服）置顶：manifest.json 的 new.* ，全自动
#   旅行者 18 个形态是 1970-01-01 占位，规则里沉底
#
# 原神武器排序：system/default/gslogs.yaml 的卡池记录算首次出现日期。
#   该文件由 apps/gacha_pool.js 每次刷新卡池自动更新，不用手改也不用改代码。
#   289 把里 54 把能取到日期（gslogs 只记 5★ up），其余按 id 降序，
#   皮肤类单独分组 —— 都是自动的
#
# 星铁光锥排序：system/default/sr_logs.yaml 的 gz_five 卡池记录算首次出现日期。
#   该文件由 apps/gacha_pool.js 每次刷新卡池自动更新，不用手改也不用改代码。
#   172 个光锥里 58 个能取到日期，其余按 id 降序 —— 都是自动的
#   （此前这里记的是「lightcone.json 没有时间字段，只能按 id 降序」，那是错的：
#     数据源没有时间不等于上线顺序拿不到，卡池记录里就有）
#
# 圣遗物 / 遗器 / 驱动盘排序：全部按 id 降序（id 顺序即上线顺序），零名单
