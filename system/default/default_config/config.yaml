#自定义攻略源（锅巴可视化修改）
#===== 自定义攻略源（极简模式）=====
#发指令：#角色名攻略 / #角色名一图流 / #角色名配对 / #角色名配队（前缀 xhh/ 或 小花火 也可，可省略）
