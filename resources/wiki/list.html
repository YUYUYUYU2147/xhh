<!doctype html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html;charset=utf-8" />
    <link rel="stylesheet" type="text/css" href="{{ppath}}wiki/list.css" />
  </head>

  <body {{sys.scale}}>
    <div class="container" id="container">
      <div class="box">
        {{each data s}}
        <div class="box_">
          <div class="ava">
            {{if s.icon}}
            <img class="rank {{s.rankClass}}{{s.tallIcon ? ' tall' : ''}}" src="{{s.icon}}" data-alt="{{s.iconFallback || ''}}" onerror="var a=(this.dataset.alt||'').split(',').filter(Boolean);if(a.length){this.src=a.shift();this.dataset.alt=a.join(',');}else{this.style.visibility='hidden'}" />
            {{else}}
            <div class="img-ph rank {{s.rankClass}}">{{s.name[0]}}</div>
            {{/if}}
            {{if s.rarityIcon}}<img class="ava-stars" src="{{s.rarityIcon}}" alt="" />{{/if}}
            {{if s.campIcon}}<img class="ava-camp" src="{{s.campIcon}}" alt="" />{{/if}}
            {{if s.isTest}}<span class="ava-test">TEST</span>{{/if}}
          </div>
          <p class="{{s.rankClass}}">{{s.name}}</p>
          {{if s.badges && s.badges.length}}
          <div class="badge-row">
            {{each s.badges b}}
              <span class="mini-badge {{b.kind || ''}}">{{if b.icon}}<img src="{{if b.icon.startsWith('http')}}{{b.icon}}{{else}}{{ppath}}wiki/imgs/{{b.icon}}{{/if}}">{{/if}}{{b.text}}</span>
            {{/each}}
          </div>
          {{/if}}
        </div>
        {{/each}}
        <span class="tab">{{name}}图鉴</span>
      </div>
      <div class="logo">from 小花火</div>
    </div>
  </body>
</html>
