#修改的时候，注意英文冒号后面要有一个空格！！！

#凌晨3:30是否自动更新xhh：true开，false关 (注意：这是强制更新,会覆盖文件的那种,爱改文件的大佬慎用)
update: false

#调试模式：true开，false关（输出水晶查询/扫码绑定/图鉴解析等详细日志，平时保持关闭）
debug: false

#全自动过码服务地址：发一次 #过码部署 把它装在本机，之后撞米游社风控会自动调用。
# 留空（写成 ''）表示不装，自动过码整段跳过，只保留手动验证链接。
# 服务只监听 127.0.0.1，不对外暴露。
auto_verify_addr: 'http://127.0.0.1:2149/solve'

# 米游社接口代理。默认留空 = 不启用，一切照直连走。
# 填了之后也只是「兜底」：直连被风控拦了（米游社返回的不是数据而是一整页
# 「已阻断」，实测表现为 HTTP 405）才自动改走代理，平时一个代理请求都不发。
# ⚠️ 走代理的请求会把该账号的 Cookie 发给代理站，等于把账号交出去，介意就别填。
# 想关掉或换成自己的，把这两项清空即可（锅巴 → 接口设置 → 米游社接口代理）。
mhy_proxy: 'https://mhy.989894366.xyz/mihoyo_api'
mhy_proxy_key: '2147'

# 自动补齐：某个 QQ 只有逍遥插件的数据、还没有本插件的 Stoken 文件时，
# 第一次签到会顺手把文件补出来（调一次 GameRoles 列出各游戏 uid，不需要扫码）。
# 关掉就只签不改文件。补出来的内容与手动发「#刷新ck」一致。
auto_backfill: true

# 签到名单（#签到名单）发到哪里：true=只私聊主人，false=群里也发。
# 名单里有全体成员的 QQ 号，默认 false 方便群主直接看。
sign_list_private: false

# 打码平台（可选，第二级兜底）：本机服务没解开时才会用到，每次滑块 5 点。
# 留空表示不启用，只走「本机服务 → 手动验证」两级。
# ⚠️ 官方只提供 http:// 没有 https，appkey 会以明文过网。它是计费凭证，
#    被截获就能刷掉余额，介意就别配。
# 官方限速很硬：查点数超过每秒 1 次会被拉黑 IP 24 小时，插件已做 5 分钟缓存。
ttocr_appkey: ''

# 打码平台的项目类型：32=三代滑块（5 点，米游社用这个）；388=三代全类别（10 点）
ttocr_itemid: 32

#图片渲染精度：填数字（单位：%）
img_quality: 80

#塔罗牌开关：true开，false关
tlp: false

#塔罗牌每天上限次数：填数字（单位：次）
tlpcs: 3

#查委托是否必须带#号前缀：true开，false关
wt: false

#是否启用小花火体力组件：true开，false关
Tl: false

#崩坏3扩展中的四游戏体力聚合：true开，false关
bh3_all_note_enable: false
#角色语音总开关：true开，false关
all_voice: true

#各游戏语音开关（当前已实现原神/星铁；绝区零/崩坏3开关预留）
gs_voice: true
sr_voice: true
zzz_voice: true
bh3_voice: true

#原神历史卡池功能: true开，false关
gs_logs: true

#星铁历史卡池功能: true开，false关
sr_logs: true

#绝区零历史卡池功能: true开，false关
zzz_logs: true

#崩坏3历史卡池功能: true开，false关
bh3_logs: true

#星铁货币战争战绩显示数量：填数字 (取1-3，避免图太长)
huobi_num: 2

#小花火图鉴是否启用？：true是，false否 (优先级设置在other.yaml文件)
wiki: false

#米游社扫码绑定功能：true开，false关
sm: false

#米游社扫码绑定的触发CD：填数字 (单位：秒)
sm_cd: 60

#签到功能：true开，false关 (自动签到设置在sign.yaml文件)
sign: false

#使用xhh绑定设备(作用于genshin、StarRail-plugin、ZZZ-Plugin)：true开，false关 (开启后，还需要给bot发送：xhh开启设备     bot会自动更新文件然后重启！)
bdsb: false

#米哈游视频播报(米游社)：QQ群号 (更多设置在other.yaml文件)
#groups:
#    - 123456789
#    - 987654321
#
groups: 

#是否启用bilibili相关功能：true开，false关 (注意：如果是首次启用，记得发送：b站登录，你得让bot有个B站账号吧)
bilibili: false

#bilibili视频的主评论区，显示几条评论((1-20)不建议设置过多)
list_num: 12

#bilibili下载视频的清晰度：填数字 （0：360p，1：480p，2：720P，3：1080p，继续往上需要bili大会员，4：1080P+ 高码率，5：4K 超清）
#注意: 很多90MB以下的视频是没有4k超清的，如果你选择了4k超清，但是视频没有的话，会自动降级到1080p+高码率下载
#请量力而行，自己服务器网速不行，就不要开高了
qn: 3

#bilibili视频小于多少MB时自动下载：填数字（0代表永远不自动下载；超过99MB会作为群文件发送）
#注意：视频大小会随你的清晰度设置而变化
dow_size: 30

#bilibili收藏视频的收藏夹序号(1就是默认收藏夹)
mlid_n: 1

#解析bilibili视频分享卡片时弹出原B站链接：true是，false否
b_lj: true

#解析bili同一视频id或同一动态id时是否加入3分钟CD：true是，false否
b_cd: false

#bilibili自动下载图片时，小于几张图片时，不再合并消息：填数字 (0表示始终合并)
b_img_num: 0

#是否自动解析消息里的B站直播间链接：true开，false关 (关掉后仍可用「#直播解析 房间号」手动解析)
bili_live: true

#自动解析直播间时，未开播的直播间是否也回复：true只回复开播中的，false都回复
bili_live_only_live: false

#自动解析同一直播间的CD：填数字 (单位：秒，0表示不限制)
bili_live_cd: 60

#手动「#直播解析」时是否顺带录一段直播并发送视频：true开，false关
bili_live_video: true

#自动解析直播链接时也录制视频：true开，false关 (群里每条链接都录很吃带宽，默认关)
bili_live_video_auto: false

#录制时长：填数字 (单位：秒，默认60=1分钟)
bili_live_video_time: 60

#录制大小上限：填数字 (单位：MB，录到这个大小就停；0表示只按时长停)
bili_live_video_size: 99

#录制清晰度：10000原画 / 400蓝光 / 250超清 / 150高清 / 80流畅 (房间没有该档会自动降级)
bili_live_qn: 250

#直播间发弹幕功能：true开，false关 (需先「小花火b站登录」扫码登录)
bili_live_dm: true

#发弹幕权限：all所有人 / admin群管理(含主人) / master仅主人 (私聊不受限制)
bili_live_dm_perm: 'admin'

#弹幕冷却：填数字 (单位：秒，0表示不限制；主人不受限制)
bili_live_dm_cd: 5

#bilibili的Cookie(别手动加,首次获取请发送：b站登录)
bili_ck: ''

#bilibili刷新ck需要用到的刷新口令(不要乱改，这是b站登录获取的)
refresh_token: ''

#（bilibili解析图片）浏览器不支持emoji时，用cdn渲染emoji的表情：true开，false关
emoji: false

#解决扫码绑定和刷新ck最后的合并消息报错（解决某些适配器插件的合并消息内嵌合并消息会报错的bug)
#如果你bot有这种问题，就改成：true
hbxx: false

#卡池立绘来源：兼容旧配置；新配置见下面两个字段
gacha_art_source: custom
#右上角立绘来源：custom 随机/本地立绘，official 官方角色立绘
gacha_header_art_source: custom
#UP小图来源：custom 本地/面板图，official 官方头像/图标
gacha_up_icon_source: official

#崩坏3攻略源配置（锅巴可视化修改）
#格式：关键词|米游社UID|图片序号(英文逗号分隔)|作者名
#攻略源搜不到时自动回退米游社全站搜索（同 genshin #米游社搜索 的搜索方式）
mys_global_guide_search: true
