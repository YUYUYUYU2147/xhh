# 原神/星铁/绝区零/崩坏3 活动到期提醒
# 可在群里发送 #原神开启活动到期推送 / #开启全部活动到期推送，也可在锅巴配置
enable: false
# 提前多少小时提醒，默认24小时内即将结束的活动推送一次
hours_before: 24
# 是否附带公告图片
push_image: true
# 提醒艾特模式：none=不艾特，all=艾特全体，users=艾特指定QQ
at_mode: none
at_users: []
# 活动标题包含这些关键词时不推送，使用 | 分隔
ban_words: 专题展示页|主题曲|前瞻特别节目预告|角色PV|签到福利|商城|周边|手办|有奖活动|已开奖|问卷|征集|作品展示|同人|大别野|米游币
# 各游戏推送群
groups:
  gs: []
  sr: []
  zzz: []
  bh3: []
